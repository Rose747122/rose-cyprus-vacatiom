<!DOCTYPE html>

<head>

</head>
<body>
  <h1>Our Family Vacation Gallery</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="gallery.html">Gallery</a>
  </nav>
  <div class="gallery">
    <img src="images/family.jpeg" alt="Family vacation">
    <img src="images/kids.jpeg" alt="Kids">
    <img src="images/hotel.jpg" alt="Hotel">
    <img src="images/park.jpg" alt="Waterpark">
    <img src="images/park1.jpeg" alt="Water slides">
  </div>
  <style>
.gallery img {
  cursor: pointer;
}
#bigPhoto {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  z-index: 9999;
  justify-content: center;
  align-items: center;
}
#bigPhoto img {
  max-width: 90vw;
  max-height: 85vh;
  object-fit: contain;
}
#closePhoto {
  position: absolute;
  top: 15px;
  right: 25px;
  color: white;
  font-size: 40px;
  cursor: pointer;
}
</style>

<div id="bigPhoto">
  <span id="closePhoto">&times;</span>
  <img id="selectedPhoto" alt="Enlarged vacation photo">
</div>
